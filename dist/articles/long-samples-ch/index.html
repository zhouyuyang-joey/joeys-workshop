<h1 id="处理较长的采样">处理较长的采样<a aria-hidden="true" tabindex="-1" href="#处理较长的采样"><span class="icon icon-link"></span></a></h1>
<p>较长的采样需要不同的处理方式，如果不小心，可能会在演奏中带来一些问题。
strudel没有内置太多长样本，所以我们会从外部引入一些采样 —— 更多信息请参见<a href="https://strudel.cc/learn/samples/#loading-custom-samples">这里</a>。
在平时的演奏中，你可以直接从strudel中通过点击的方式来载入本地采样：<a href="https://strudel.cc/">strudel.cc</a>  -&gt; 右侧的小箭头 -&gt; sounds -&gt; import-sounds
在这个worksheet中，我们先从github上引入采样。</p>
<p><code>loopAt</code> 可以让我们将采样与指定的循环数同步，在下面的案例中，采样每4个循环重复一次。</p>
